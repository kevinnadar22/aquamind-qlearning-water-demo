<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaMind — Autonomous Water Operations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    body { background: linear-gradient(165deg, #0f172a 0%, #0c4a6e 45%, #0f172a 100%); min-height: 100vh; }
    .glass { background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.15); }
    .chart-box { height: 260px; }
    .flow-line { stroke-dasharray: 8 10; animation: flowDash 1.2s linear infinite; }
    @keyframes flowDash { to { stroke-dashoffset: -36; } }
    @keyframes leakPulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.95; transform: scale(1.15); } }
    .leak-dot { animation: leakPulse 1.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    #resFill { transform-box: fill-box; transform-origin: bottom center; }
  </style>
</head>
<body class="text-slate-100 font-sans antialiased">
  <header class="border-b border-white/10 glass sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-teal-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3c4 8 8 8 8 13a8 8 0 11-16 0c0-5 4-5 8-13z"/></svg>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">AquaMind</h1>
          <p class="text-xs text-slate-400">Q-Learning control for resilient water networks</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <label class="text-sm text-slate-400">Scenario</label>
        <select id="scenario" class="glass rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-cyan-500 outline-none">
          <option value="normal">Normal operations</option>
          <option value="drought">Drought (reduced inflow)</option>
          <option value="leak">Pipe leak (Industrial zone)</option>
        </select>
        <button id="runBtn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-semibold px-5 py-2 rounded-lg text-sm transition shadow-lg shadow-cyan-500/25">
          Run simulation
        </button>
        <span id="status" class="text-xs text-slate-500">Ready</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-8">
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <article class="glass rounded-2xl p-5">
        <p class="text-xs uppercase tracking-wider text-slate-400 mb-1">Water loss reduction</p>
        <p class="text-3xl font-bold text-emerald-400"><span id="kpiLoss">—</span><span class="text-lg">%</span></p>
        <p class="text-xs text-slate-500 mt-2">AI vs static SCADA baseline</p>
      </article>
      <article class="glass rounded-2xl p-5">
        <p class="text-xs uppercase tracking-wider text-slate-400 mb-1">Hospital supply reliability</p>
        <p class="text-3xl font-bold text-cyan-300"><span id="kpiHosp">—</span><span class="text-lg">%</span></p>
        <p class="text-xs text-slate-500 mt-2">Agent · baseline <span id="kpiHospBase">—</span>%</p>
      </article>
      <article class="glass rounded-2xl p-5">
        <p class="text-xs uppercase tracking-wider text-slate-400 mb-1">Mean off-peak pressure</p>
        <p class="text-3xl font-bold text-sky-300"><span id="kpiPress">—</span><span class="text-lg"> m</span></p>
        <p class="text-xs text-slate-500 mt-2">Target &lt; 25 m · baseline <span id="kpiPressBase">—</span> m</p>
      </article>
